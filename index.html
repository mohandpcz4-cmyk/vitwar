<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vitwar | Taste the joy, live the sweetness</title>
<meta name="theme-color" content="#ec3da7" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192.png" />
<link rel="apple-touch-icon" href="images/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vitwar" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- شاشة اختيار الفرع -->
  <div id="branchSelectScreen" class="branch-select-screen">
    <div class="branch-select-box">
      <img src="images/logo.png" class="branch-select-logo" alt="Vitwar" />
      <h2>اختيار الفرع</h2>
      <p class="branch-select-hint">اختار أقرب فرع ليك عشان تطلب</p>
      <div class="branch-options" id="branchOptions"></div>
    </div>
  </div>

  <div id="siteWrap" style="display:none">
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <img src="images/logo.png" alt="Vitwar" />
          <span class="brand-name">Vitwar</span>
          <span class="branch-badge" id="branchBadge"></span>
        </div>
        <div class="header-actions">
          <button class="glass-icon-btn tap-fx" id="installAppBtn" title="تثبيت التطبيق" style="display:none">📲</button>
          <button class="glass-icon-btn tap-fx" id="changeBranchBtn" title="تغيير الفرع">🏬</button>
          <button class="glass-icon-btn tap-fx" id="supportFab" title="تواصل مع الدعم">💬</button>
          <button class="glass-icon-btn theme-toggle tap-fx" id="themeToggle" title="تبديل الوضع">🌙</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="status-strip" id="statusStrip" style="display:none"></div>
      <div class="categories-bar" id="categoriesBar"></div>
      <div class="products-grid" id="productsGrid"></div>
    </main>

    <footer class="site-footer">
      <div class="container">© Vitwar — كل الحقوق محفوظة</div>
    </footer>

    <!-- زرار السلة العائم -->
    <div class="cart-fab">
      <button class="glass-btn tap-fx" id="cartFab">
        🛒 السلة <span id="cartCountText">(0)</span>
      </button>
    </div>

    <!-- درج السلة -->
    <div class="cart-drawer" id="cartDrawer">
      <div class="cart-overlay" id="cartOverlay"></div>
      <div class="cart-panel">
        <div class="admin-header">
          <h2 style="margin:0">سلتك</h2>
          <button class="glass-icon-btn tap-fx" id="closeCart">✕</button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-total-row">
          <span>الإجمالي</span>
          <span id="cartTotal">0 ج.م</span>
        </div>
        <button class="glass-btn tap-fx" id="checkoutBtn" style="width:100%">إتمام الطلب</button>
      </div>
    </div>

    <!-- مودال اختيار المنتج -->
    <div class="product-modal" id="productModal">
      <div class="cart-overlay" id="productModalOverlay"></div>
      <div class="product-modal-panel">
        <div class="admin-header">
          <h2 style="margin:0">تخصيص الطلب</h2>
          <button class="glass-icon-btn tap-fx" id="closeProductModal">✕</button>
        </div>
        <img id="modalProductImg" class="modal-product-img" onerror="this.src='images/logo.png'" />
        <h3 id="modalProductName" style="margin:10px 0 4px"></h3>
        <p id="modalProductDesc" style="color:var(--muted);font-size:.9rem;margin-top:0"></p>

        <div class="option-box" id="modalOptionBox"></div>

        <div class="cart-total-row">
          <span>الإجمالي</span>
          <span id="modalTotalPrice">0 ج.م</span>
        </div>
        <button class="glass-btn tap-fx" id="modalAddToCart" style="width:100%">أضف للسلة</button>
      </div>
    </div>

    <!-- مودال إتمام الطلب -->
    <div class="product-modal" id="checkoutModal">
      <div class="cart-overlay" id="checkoutModalOverlay"></div>
      <div class="product-modal-panel">
        <div class="admin-header">
          <h2 style="margin:0">إتمام الطلب</h2>
          <button class="glass-icon-btn tap-fx" id="closeCheckoutModal">✕</button>
        </div>

        <div id="checkoutStep1">
          <p style="color:var(--muted)">اختار طريقة استلام طلبك</p>
          <div class="order-type-grid">
            <button class="glass-btn order-type-btn tap-fx" data-order-type="cafe">☕<br/>كافيه</button>
            <button class="glass-btn order-type-btn tap-fx" data-order-type="delivery">🛵<br/>توصيل</button>
            <button class="glass-btn order-type-btn tap-fx" data-order-type="pickup">🏃<br/>استلام</button>
          </div>
        </div>

        <div id="checkoutStep2" style="display:none"></div>
      </div>
    </div>

    <!-- إشعار زجاجي عائم -->
    <div class="glass-note" id="glassNote"></div>

    <!-- شات الدعم -->
    <div class="product-modal support-chat-modal" id="supportChatModal">
      <div class="cart-overlay" id="supportChatOverlay"></div>
      <div class="product-modal-panel support-chat-panel">

        <div class="support-chat-header">
          <img src="images/logo.png" class="support-chat-avatar" alt="Vitwar" />
          <div class="support-chat-titlebox">
            <div class="support-chat-title">
              Vitwar
              <svg class="verified-badge" viewBox="0 0 22 22" width="16" height="16">
                <path fill="currentColor" d="M10.16 1.75c.44-.99 1.86-.99 2.3 0l.9 2.02a1.26 1.26 0 0 0 1.36.72l2.18-.4c1.06-.2 1.94.72 1.72 1.77l-.46 2.17c-.13.6.12 1.22.63 1.56l1.83 1.22c.9.6.9 1.93 0 2.53l-1.83 1.22c-.51.34-.76.96-.63 1.56l.46 2.17c.22 1.05-.66 1.97-1.72 1.77l-2.18-.4a1.26 1.26 0 0 0-1.36.72l-.9 2.02c-.44.99-1.86.99-2.3 0l-.9-2.02a1.26 1.26 0 0 0-1.36-.72l-2.18.4c-1.06.2-1.94-.72-1.72-1.77l.46-2.17c.13-.6-.12-1.22-.63-1.56L1.7 12.06c-.9-.6-.9-1.93 0-2.53l1.83-1.22c.51-.34.76-.96.63-1.56l-.46-2.17c-.22-1.05.66-1.97 1.72-1.77l2.18.4a1.26 1.26 0 0 0 1.36-.72l.9-2.02Z"/>
                <path fill="var(--surface)" d="m9.2 14.6-3-3 1.1-1.1 1.9 1.9 4.4-4.4 1.1 1.1-5.5 5.5Z"/>
              </svg>
            </div>
            <div class="support-chat-subtitle" id="supportChatSubtitle">الدعم</div>
          </div>
          <button class="glass-icon-btn tap-fx" id="closeSupportChat">✕</button>
        </div>

        <!-- فورم الاسم ورقم الموبايل -->
        <div id="supportChatForm" class="option-box">
          <div class="variant-group-label">قبل ما نبدأ، محتاجين بياناتك</div>
          <div class="field">
            <label>الاسم</label>
            <input type="text" id="supportFieldName" placeholder="اكتب اسمك" />
          </div>
          <div class="field">
            <label>رقم الموبايل</label>
            <input type="tel" id="supportFieldPhone" placeholder="01xxxxxxxxx" maxlength="11" inputmode="numeric" />
          </div>
          <p class="error-msg" id="supportFormError"></p>
          <button class="glass-btn tap-fx" id="startSupportChatBtn" style="width:100%">ابدأ المحادثة</button>
        </div>

        <!-- شاشة الشات -->
        <div id="supportChatBody" style="display:none">
          <div class="support-chat-messages" id="supportChatMessages"></div>
          <div class="support-chat-closed-note" id="supportChatClosedNote" style="display:none">
            🔒 المحادثة دي اتقفلت من الدعم
            <button class="glass-btn-secondary glass-btn tap-fx" id="newSupportChatBtn">بدء محادثة جديدة</button>
          </div>
          <div class="support-chat-input-row" id="supportChatInputRow">
            <input type="text" id="supportChatInput" placeholder="اكتب رسالتك..." />
            <button class="glass-icon-btn tap-fx" id="sendSupportChatBtn">➤</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat build - يشتغل بأي HTML عادي) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chat.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
