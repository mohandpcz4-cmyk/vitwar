<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vitwar | Taste the joy, live the sweetness</title>
<meta name="theme-color" content="#ec3da7" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- شاشة اختيار الفرع -->
  <div id="branchSelectScreen" class="branch-select-screen">
    <div class="branch-select-box">
      <img src="images/logo.png" class="branch-select-logo" alt="Vitwar" />
      <h2>اختيار الفرع</h2>
      <p class="branch-select-hint">اختار أقرب فرع ليك عشان تطلب</p>
      <div class="branch-options" id="branchOptions"></div>
    </div>
  </div>

  <div id="siteWrap" style="display:none">
    <header class="site-header">
      <div class="container header-inner">
        <div class="brand">
          <img src="images/logo.png" alt="Vitwar" />
          <span class="brand-name">Vitwar</span>
          <span class="branch-badge" id="branchBadge"></span>
        </div>
        <div class="header-actions">
          <button class="glass-icon-btn tap-fx" id="changeBranchBtn" title="تغيير الفرع">🏬</button>
          <button class="glass-icon-btn theme-toggle tap-fx" id="themeToggle" title="تبديل الوضع">🌙</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="status-strip" id="statusStrip" style="display:none"></div>
      <div class="categories-bar" id="categoriesBar"></div>
      <div class="products-grid" id="productsGrid"></div>
    </main>

    <footer class="site-footer">
      <div class="container">© Vitwar — كل الحقوق محفوظة</div>
    </footer>

    <!-- زرار السلة العائم -->
    <div class="cart-fab">
      <button class="glass-btn tap-fx" id="cartFab">
        🛒 السلة <span id="cartCountText">(0)</span>
      </button>
    </div>

    <!-- درج السلة -->
    <div class="cart-drawer" id="cartDrawer">
      <div class="cart-overlay" id="cartOverlay"></div>
      <div class="cart-panel">
        <div class="admin-header">
          <h2 style="margin:0">سلتك</h2>
          <button class="glass-icon-btn tap-fx" id="closeCart">✕</button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-total-row">
          <span>الإجمالي</span>
          <span id="cartTotal">0 ج.م</span>
        </div>
        <button class="glass-btn tap-fx" id="checkoutBtn" style="width:100%">إتمام الطلب</button>
      </div>
    </div>

    <!-- مودال اختيار المنتج -->
    <div class="product-modal" id="productModal">
      <div class="cart-overlay" id="productModalOverlay"></div>
      <div class="product-modal-panel">
        <div class="admin-header">
          <h2 style="margin:0">تخصيص الطلب</h2>
          <button class="glass-icon-btn tap-fx" id="closeProductModal">✕</button>
        </div>
        <img id="modalProductImg" class="modal-product-img" onerror="this.src='images/logo.png'" />
        <h3 id="modalProductName" style="margin:10px 0 4px"></h3>
        <p id="modalProductDesc" style="color:var(--muted);font-size:.9rem;margin-top:0"></p>

        <div class="option-box" id="modalOptionBox"></div>

        <div class="cart-total-row">
          <span>الإجمالي</span>
          <span id="modalTotalPrice">0 ج.م</span>
        </div>
        <button class="glass-btn tap-fx" id="modalAddToCart" style="width:100%">أضف للسلة</button>
      </div>
    </div>

    <!-- مودال إتمام الطلب -->
    <div class="product-modal" id="checkoutModal">
      <div class="cart-overlay" id="checkoutModalOverlay"></div>
      <div class="product-modal-panel">
        <div class="admin-header">
          <h2 style="margin:0">إتمام الطلب</h2>
          <button class="glass-icon-btn tap-fx" id="closeCheckoutModal">✕</button>
        </div>

        <div id="checkoutStep1">
          <p style="color:var(--muted)">اختار طريقة استلام طلبك</p>
          <div class="order-type-grid">
            <button class="glass-btn order-type-btn tap-fx" data-order-type="cafe">☕<br/>كافيه</button>
            <button class="glass-btn order-type-btn tap-fx" data-order-type="delivery">🛵<br/>توصيل</button>
            <button class="glass-btn order-type-btn tap-fx" data-order-type="pickup">🏃<br/>استلام</button>
          </div>
        </div>

        <div id="checkoutStep2" style="display:none"></div>
      </div>
    </div>

    <!-- إشعار زجاجي عائم -->
    <div class="glass-note" id="glassNote"></div>
  </div>

  <!-- Firebase SDK (compat build - يشتغل بأي HTML عادي) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/telegram.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
